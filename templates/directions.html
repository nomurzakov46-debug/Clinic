{% extends 'base.html' %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{%  static 'css/home.css'   %}">
{% endblock %}

{% block content %}
<section>
    <section class="directions">
<div class="container">
<div class="direction_head">
<h2>Направления нашей работы</h2>

</div>

<div class="direction_list direction_list--all">
    {% for direction in directions %}
        <div class="card">
            <img src="{{ direction.image.url }}" alt="{{ direction.name }}" class="card_img">
            <div class="card_body">
                <h3>{{ direction.name }}</h3>
                <a href="{% url 'direction_detail' direction.slug %}">Подробнее</a>
            </div>
        </div>
    {% endfor %}
</div>
</div>
</section>
</section>
{% include 'appointment_block.html' %}
{% endblock %}
